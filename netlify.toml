[build]
  publish = "dist"
  command = "bun run build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_CLOUD_NAME"

# Form handling
[[forms]]
  name = "contact"

# 1. CACHE FONTS (Specific path for your /public/fonts folder)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# 2. CACHE ASSETS (Images, etc.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 3. CACHE JS/CSS BUNDLES
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 4. SECURITY HEADERS (Applied to everything)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # CSP notes:
    # - script-src 'self': no inline scripts exist; keep it that way.
    # - style-src needs 'unsafe-inline' for the index.html critical CSS and
    #   React inline style attributes. Documented trade-off; do not widen further.
    # - img-src allows Cloudinary (project screenshots) and data: (favicons).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://res.cloudinary.com data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200